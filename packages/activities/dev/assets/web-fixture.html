<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>芽芽成长 · 网页互动样例</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #dff1fb; color: #3b3226; font-family: system-ui, sans-serif; }
      main { display: grid; justify-items: center; gap: 20px; padding: 24px; text-align: center; }
      h1 { margin: 0; font-size: 28px; }
      button { width: 120px; height: 120px; border: 0; border-radius: 50%; background: #f2b134; color: #3b3226; font-size: 24px; cursor: pointer; }
      button:focus-visible { outline: 6px solid #3d8fb8; outline-offset: 8px; }
      button:disabled { background: #e6f4d7; cursor: default; }
      output { min-height: 28px; font-size: 20px; }
    </style>
  </head>
  <body>
    <main>
      <h1>和太阳打个招呼</h1>
      <button id="finish" type="button" aria-label="向太阳问好，结束互动">你好</button>
      <output id="result" aria-live="polite"></output>
    </main>
    <script>
      const parentOrigin = new URLSearchParams(window.location.search).get('parentOrigin');
      let trustedParent = false;
      try {
        const parent = new URL(parentOrigin);
        trustedParent = ['localhost', '127.0.0.1'].includes(parent.hostname)
          && parent.protocol === window.location.protocol
          && parent.port === window.location.port
          && parent.origin === parentOrigin
          && parent.origin !== window.location.origin;
      } catch {}
      document.getElementById('finish').addEventListener('click', (event) => {
        event.currentTarget.disabled = true;
        document.getElementById('result').textContent = '太阳也向你问好！';
        if (window.parent !== window && trustedParent) {
          window.parent.postMessage({ type: 'sprout:complete' }, parentOrigin);
        }
      }, { once: true });
    </script>
  </body>
</html>
